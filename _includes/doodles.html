{% comment %} Small inline doodles: include doodles.html kind="star|sparkle|heart" class="..." size="34" {% endcomment %}
{% assign s = include.size | default: 30 %}
{% if include.kind == 'sparkle' %}
<svg aria-hidden="true" class="doodle {{ include.class }}" width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="#A3B899"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z"/></svg>
{% elsif include.kind == 'heart' %}
<svg aria-hidden="true" class="doodle {{ include.class }}" width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="#FEF9E3" stroke="#4D1821" stroke-width="1.3" stroke-linejoin="round"><path d="M12 21s-7-4.4-9.3-9C1.2 8.6 3.4 5 6.8 5c2 0 3.6 1.2 5.2 3 1.6-1.8 3.2-3 5.2-3 3.4 0 5.6 3.6 4.1 7-2.3 4.6-9.3 9-9.3 9z"/></svg>
{% else %}
<svg aria-hidden="true" class="doodle {{ include.class }}" width="{{ s }}" height="{{ s }}" viewBox="0 0 24 24" fill="{{ include.fill | default: '#FEF9E3' }}" stroke="#4D1821" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2l2.6 6.3 6.8.6-5.2 4.5 1.6 6.6L12 16.6 6.2 20l1.6-6.6L2.6 8.9l6.8-.6z"/></svg>
{% endif %}
